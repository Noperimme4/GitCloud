name: GitCloud Advanced Engine

on:
  repository_dispatch:
    types: [start_download]

jobs:
  process_download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 ffmpeg
          pip install --upgrade requests yt-dlp

      - name: Reliable Cloud Download & Error Reporting
        env:
          TARGET_URL: ${{ github.event.client_payload.url }}
          WEBHOOK_URL: ${{ github.event.client_payload.webhook_url || 'https://gitcloud.modern-tools.ir/webhook/github-done' }}
          ERROR_WEBHOOK: 'https://gitcloud.modern-tools.ir/webhook/github-error'
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
        run: |
          python3 -c "
          import requests
          import os
          import subprocess
          import sys

          url = os.environ.get('TARGET_URL', '')
          chat_id = os.environ.get('CHAT_ID', '')
          error_webhook = os.environ.get('ERROR_WEBHOOK', '')

          print('Starting GitCloud download for:', url)
          downloaded = False
          error_msg = ''

          # 1. Try Cobalt API
          try:
              headers = {'Accept': 'application/json', 'Content-Type': 'application/json', 'User-Agent': 'Mozilla/5.0'}
              body = {'url': url}
              r = requests.post('https://api.cobalt.tools/api/json', json=body, headers=headers, timeout=25)
              if r.status_code == 200:
                  j = r.json()
                  dl = j.get('url') or (j.get('picker') and j.get('picker')[0].get('url'))
                  if dl:
                      sr = requests.get(dl, stream=True, timeout=300, headers={'User-Agent': 'Mozilla/5.0'})
                      with open('downloaded_file.mp4', 'wb') as f:
                          for chunk in sr.iter_content(chunk_size=4*1024*1024):
                              if chunk: f.write(chunk)
                      if os.path.exists('downloaded_file.mp4') and os.path.getsize('downloaded_file.mp4') > 5000000:
                          downloaded = True
          except Exception as e:
              error_msg += f'Cobalt API Error: {e}; '

          # 2. Try yt-dlp android client
          if not downloaded:
              try:
                  res_sub = subprocess.run(['yt-dlp', '--no-playlist', '--extractor-args', 'youtube:player_client=android', '-f', '18/best', '-o', 'downloaded_file.mp4', url], capture_output=True, text=True)
                  if res_sub.returncode == 0 and os.path.exists('downloaded_file.mp4') and os.path.getsize('downloaded_file.mp4') > 5000000:
                      downloaded = True
                  else:
                      error_msg += f'yt-dlp Error: {res_sub.stderr[:300]}; '
              except Exception as e:
                  error_msg += f'yt-dlp Exception: {e}; '

          # 3. Fallback sample video if all fail, and report error to admin logbot via worker
          if not downloaded:
              print('All download attempts failed. Generating sample video and notifying admin...')
              subprocess.run(['ffmpeg', '-f', 'lavfi', '-i', 'testsrc=duration=300:size=1280x720:rate=30', '-f', 'lavfi', '-i', 'sine=frequency=1000:duration=300', '-c:v', 'libx264', '-b:v', '1.2M', '-c:a', 'aac', 'downloaded_file.mp4', '-y'])
              
              # Send detailed error to worker error endpoint
              try:
                  requests.post(error_webhook, json={'chat_id': chat_id, 'error': f'Download failed for {url}. Details: {error_msg}'}, timeout=10)
              except Exception as err:
                  print('Failed to report error to worker:', err)

          print('Final file size:', os.path.getsize('downloaded_file.mp4') / (1024*1024), 'MB')
          "
          
          FILE_SIZE=$(du -sh downloaded_file.mp4 2>/dev/null | awk '{print $1}')
          echo "FILE_SIZE=$FILE_SIZE" >> $GITHUB_ENV
          ls -lh downloaded_file.mp4

      - name: Create GitHub Release & Upload Files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: file-${{ github.run_number }}-${{ github.run_id }}
          name: Cloud Download #${{ github.run_number }}
          body: Powered by GitCloud. Retention: 12 hours.
          files: downloaded_file.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Webhook Notification to Cloudflare Worker
        if: always()
        env:
          WEBHOOK_URL: ${{ github.event.client_payload.webhook_url || 'https://gitcloud.modern-tools.ir/webhook/github-done' }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          DURATION: "12 hours"
          FILE_SIZE: ${{ env.FILE_SIZE }}
          TAG_NAME: file-${{ github.run_number }}-${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          DOWNLOAD_LINK="https://github.com/${REPO}/releases/download/${TAG_NAME}/downloaded_file.mp4"
          curl -s -X POST "$WEBHOOK_URL" -H "Content-Type: application/json" -d "{\"chat_id\": \"$CHAT_ID\", \"duration\": \"12 hours\", \"file_size\": \"$FILE_SIZE\", \"download_link\": \"$DOWNLOAD_LINK\"}"
