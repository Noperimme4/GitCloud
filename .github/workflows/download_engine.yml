name: GitCloud Advanced Engine

on:
  repository_dispatch:
    types: [start_download]

jobs:
  process_download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 ffmpeg
          pip install --upgrade yt-dlp requests

      - name: Smart Download with Python
        env:
          TARGET_URL: ${{ github.event.client_payload.url }}
        run: |
          python3 -c "
          import yt_dlp
          import sys
          import os

          url = os.environ['TARGET_URL']
          print(f'Starting download for: {url}')

          ydl_opts = {
              'outtmpl': 'downloaded_file.mp4',
              'format': 'bestvideo[height<=480]+bestaudio/best[height<=480]/best',
              'noplaylist': True,
          }

          try:
              with yt_dlp.YoutubeDL(ydl_opts) as ydl:
                  ydl.download([url])
              print('Download completed successfully via yt_dlp.')
          except Exception as e:
              print(f'yt_dlp failed: {e}, trying direct curl...')
              os.system(f'curl -LJO "{url}" -o downloaded_file.mp4')
          "
          
          ls -la
          
          # Verify file size and content
          if [ ! -f "downloaded_file.mp4" ] || [ $(stat -c%s "downloaded_file.mp4") -lt 10000 ]; then
            echo "Error: Downloaded file is missing or too small!"
            exit 1
          fi

      - name: Create GitHub Release & Upload Files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: file-${{ github.run_number }}-${{ github.run_id }}
          name: Cloud Download #${{ github.run_number }}
          body: Powered by GitCloud.
          files: downloaded_file.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Webhook Notification to Cloudflare Worker
        if: always()
        env:
          WEBHOOK_URL: ${{ github.event.client_payload.webhook_url || 'https://gitcloud.modern-tools.ir/webhook/github-done' }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          DURATION: "30"
          FILE_SIZE: "45MB"
          TAG_NAME: file-${{ github.run_number }}-${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          DOWNLOAD_LINK="https://github.com/${REPO}/releases/download/${TAG_NAME}/downloaded_file.mp4"
          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"$CHAT_ID\", \"duration\": \"$DURATION\", \"file_size\": \"$FILE_SIZE\", \"download_link\": \"$DOWNLOAD_LINK\"}"
