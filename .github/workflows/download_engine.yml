name: GitCloud Advanced Engine

on:
  repository_dispatch:
    types: [start_download]
  workflow_dispatch:

jobs:
  process_download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install --upgrade yt-dlp

      - name: Download Video
        env:
          TARGET_URL: ${{ github.event.client_payload.url }}
        run: |
          yt-dlp --no-playlist --extractor-args "youtube:player_client=android" -f "18/best" -o "downloaded_file.mp4" "${TARGET_URL:-https://youtu.be/gyUFqBm3Q4o}"
          ls -lh downloaded_file.mp4

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: file-${{ github.run_number }}-${{ github.run_id }}
          files: downloaded_file.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Webhook Notification
        if: always()
        env:
          WEBHOOK_URL: ${{ github.event.client_payload.webhook_url || 'https://gitcloud.modern-tools.ir/webhook/github-done' }}
          CHAT_ID: ${{ github.event.client_payload.chat_id || '7645510290' }}
          TAG_NAME: file-${{ github.run_number }}-${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          FILE_SIZE=$(du -sh downloaded_file.mp4 2>/dev/null | awk '{print $1}')
          DOWNLOAD_LINK="https://github.com/${REPO}/releases/download/${TAG_NAME}/downloaded_file.mp4"
          curl -s -X POST "$WEBHOOK_URL" -H "Content-Type: application/json" -d "{"chat_id": "$CHAT_ID", "duration": "12 hours", "file_size": "$FILE_SIZE", "download_link": "$DOWNLOAD_LINK"}"
