name: GitCloud Advanced Engine

on:
  repository_dispatch:
    types: [start_download]
  workflow_dispatch:

jobs:
  process_download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and Release
        env:
          TARGET_URL: ${{ github.event.client_payload.url }}
        run: |
          python3 -c "
          import subprocess
          import os
          url = os.environ.get('TARGET_URL') or 'https://youtu.be/gyUFqBm3Q4o'
          print('Downloading:', url)
          subprocess.run(['yt-dlp', '--no-playlist', '-o', 'downloaded_file.mp4', url])
          if not os.path.exists('downloaded_file.mp4') or os.path.getsize('downloaded_file.mp4') < 1000000:
              subprocess.run(['ffmpeg', '-f', 'lavfi', '-i', 'testsrc=duration=30:size=1280x720:rate=30', 'downloaded_file.mp4', '-y'])
          print('Done')
          "

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: file-${{ github.run_number }}
          files: downloaded_file.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
