name: GitCloud Advanced Engine

on:
  repository_dispatch:
    types: [start_download]

jobs:
  process_download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 ffmpeg
          pip install --upgrade --pre yt-dlp requests

      - name: Create Python Downloader
        run: |
          cat << 'EOF' > dl.py
          import requests
          import os
          import sys
          import subprocess
          import re

          url = os.environ.get('TARGET_URL')
          print(f"Target URL: {url}")

          vid_id = None
          match = re.search(r'(?:v=|/)([0-9A-Za-z_-]{11})', url)
          if match:
              vid_id = match.group(1)

          downloaded = False

          if vid_id:
              invidious_instances = [
                  "https://invidious.perennialte.ch",
                  "https://inv.nadeko.net",
                  "https://invidious.privacyredirect.com",
                  "https://yt.artemislena.eu"
              ]
              for inst in invidious_instances:
                  try:
                      print(f"Trying Invidious instance: {inst}")
                      api_url = f"{inst}/api/v1/videos/{vid_id}"
                      res = requests.get(api_url, timeout=10)
                      if res.status_code == 200:
                          vdata = res.json()
                          formats = vdata.get('formatStreams', [])
                          stream_url = None
                          for fmt in formats:
                              if fmt.get('container') == 'mp4':
                                  stream_url = fmt.get('url')
                                  break
                          if not stream_url and formats:
                              stream_url = formats[0].get('url')
                          
                          if stream_url:
                              print(f"Found stream URL from Invidious! Downloading...")
                              r = requests.get(stream_url, stream=True, timeout=60)
                              if r.status_code == 200:
                                  with open("downloaded_file.mp4", "wb") as f:
                                      for chunk in r.iter_content(chunk_size=1024*1024):
                                          if chunk: f.write(chunk)
                                  if os.path.exists("downloaded_file.mp4") and os.path.getsize("downloaded_file.mp4") > 100000:
                                      print(f"Successfully downloaded via Invidious! Size: {os.path.getsize('downloaded_file.mp4')} bytes")
                                      downloaded = True
                                      break
                  except Exception as e:
                      print(f"Invidious {inst} error: {e}")

          if not downloaded:
              print("Trying yt-dlp fallback...")
              strategies = [
                  ['yt-dlp', '--no-playlist', '--extractor-args', 'youtube:player_client=android_embedded', '-o', 'downloaded_file.mp4', url],
                  ['yt-dlp', '--no-playlist', '--extractor-args', 'youtube:player_client=ios', '-o', 'downloaded_file.mp4', url],
                  ['yt-dlp', '--no-playlist', '-o', 'downloaded_file.mp4', url],
              ]
              for cmd in strategies:
                  print(f"Running: {' '.join(cmd)}")
                  res = subprocess.run(cmd)
                  if res.returncode == 0 and os.path.exists("downloaded_file.mp4") and os.path.getsize("downloaded_file.mp4") > 100000:
                      downloaded = True
                      break

          if not downloaded:
              print("All download strategies failed!")
              sys.exit(1)
          EOF

      - name: Smart Download
        env:
          TARGET_URL: ${{ github.event.client_payload.url }}
        run: |
          python3 dl.py
          ls -la

      - name: Create GitHub Release & Upload Files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: file-${{ github.run_number }}-${{ github.run_id }}
          name: Cloud Download #${{ github.run_number }}
          body: Powered by GitCloud.
          files: downloaded_file.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Webhook Notification to Cloudflare Worker
        if: always()
        env:
          WEBHOOK_URL: ${{ github.event.client_payload.webhook_url || 'https://gitcloud.modern-tools.ir/webhook/github-done' }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          DURATION: "30"
          FILE_SIZE: "45MB"
          TAG_NAME: file-${{ github.run_number }}-${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          DOWNLOAD_LINK="https://github.com/${REPO}/releases/download/${TAG_NAME}/downloaded_file.mp4"
          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"$CHAT_ID\", \"duration\": \"$DURATION\", \"file_size\": \"$FILE_SIZE\", \"download_link\": \"$DOWNLOAD_LINK\"}"
