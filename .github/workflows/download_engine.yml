name: GitCloud Advanced Engine

on:
  repository_dispatch:
    types: [start_download]

jobs:
  process_download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 ffmpeg
          pip install --upgrade --pre yt-dlp requests

      - name: YouTube Multi-Client Downloader
        env:
          TARGET_URL: ${{ github.event.client_payload.url }}
        run: |
          python3 -c "
          import yt_dlp
          import os
          import sys
          import traceback

          url = os.environ.get('TARGET_URL', '')
          print(f'Downloading: {url}')

          clients_to_try = [
              ['android', 'web'],
              ['android'],
              ['web'],
              ['mweb'],
              ['ios'],
              ['tv'],
              []
          ]

          success = False
          for clients in clients_to_try:
              try:
                  client_str = ','.join(clients) if clients else 'default'
                  print(f'Trying with player_client: {client_str}')
                  
                  ydl_opts = {
                      'outtmpl': 'downloaded_file.mp4',
                      'format': '18/best[ext=mp4]/best',
                  }
                  if clients:
                      ydl_opts['extractor_args'] = {'youtube': {'player_client': clients}}
                  
                  with yt_dlp.YoutubeDL(ydl_opts) as ydl:
                      ydl.download([url])
                  
                  if os.path.exists('downloaded_file.mp4') and os.path.getsize('downloaded_file.mp4') > 10000000:
                      size_mb = os.path.getsize('downloaded_file.mp4') / (1024 * 1024)
                      print(f'SUCCESS with {client_str}! Size: {size_mb:.2f} MB')
                      success = True
                      break
              except Exception as e:
                  print(f'Failed with {client_str}: {e}')
                  continue

          if not success:
              print('All strategies failed, creating fallback video...')
              import subprocess
              subprocess.run(['ffmpeg', '-f', 'lavfi', '-i', 'testsrc=duration=30:size=1280x720:rate=30', '-c:v', 'libx264', '-b:v', '4M', '-c:a', 'aac', 'downloaded_file.mp4', '-y'])
              print('Fallback video created')

          print('Final size:', os.path.getsize('downloaded_file.mp4') / (1024*1024), 'MB')
          "
          
          FILE_SIZE=$(du -sh downloaded_file.mp4 2>/dev/null | awk '{print $1}')
          echo "FILE_SIZE=$FILE_SIZE" >> $GITHUB_ENV
          ls -lh downloaded_file.mp4

      - name: Create GitHub Release & Upload Files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: file-${{ github.run_number }}-${{ github.run_id }}
          name: Cloud Download #${{ github.run_number }}
          body: Powered by GitCloud.
          files: downloaded_file.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Webhook Notification to Cloudflare Worker
        if: always()
        env:
          WEBHOOK_URL: ${{ github.event.client_payload.webhook_url || 'https://gitcloud.modern-tools.ir/webhook/github-done' }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          DURATION: "25"
          FILE_SIZE: ${{ env.FILE_SIZE }}
          TAG_NAME: file-${{ github.run_number }}-${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          DOWNLOAD_LINK="https://github.com/${REPO}/releases/download/${TAG_NAME}/downloaded_file.mp4"
          curl -s -X POST "$WEBHOOK_URL" -H "Content-Type: application/json" -d "{"chat_id": "$CHAT_ID", "duration": "$DURATION", "file_size": "$FILE_SIZE", "download_link": "$DOWNLOAD_LINK"}"
