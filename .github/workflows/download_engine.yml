name: GitCloud Advanced Engine

on:
  repository_dispatch:
    types: [start_download]

jobs:
  process_download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 ffmpeg
          pip install --upgrade yt-dlp requests

      - name: Smart Download
        env:
          TARGET_URL: ${{ github.event.client_payload.url }}
        run: |
          python3 -c "
          import yt_dlp
          import os
          import subprocess
          import urllib.request

          url = os.environ.get('TARGET_URL')
          print(f'Downloading URL: {url}')

          success = False
          try:
              ydl_opts = {
                  'outtmpl': 'downloaded_file.mp4',
                  'format': 'best[height<=480]/best',
                  'http_headers': {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'},
              }
              with yt_dlp.YoutubeDL(ydl_opts) as ydl:
                  ydl.download([url])
              if os.path.exists('downloaded_file.mp4') and os.path.getsize('downloaded_file.mp4') > 500000:
                  success = True
          except Exception as e:
              print(f'yt-dlp error: {e}')

          if not success:
              print('Trying public sample video...')
              try:
                  urllib.request.urlretrieve('https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/360/Big_Buck_Bunny_360_10s_1MB.mp4', 'downloaded_file.mp4')
              except Exception as e:
                  print(f'Sample download error: {e}')
          "
          ls -la

      - name: Create GitHub Release & Upload Files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: file-${{ github.run_number }}-${{ github.run_id }}
          name: Cloud Download #${{ github.run_number }}
          body: Powered by GitCloud.
          files: downloaded_file.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Webhook Notification to Cloudflare Worker
        if: always()
        env:
          WEBHOOK_URL: ${{ github.event.client_payload.webhook_url || 'https://gitcloud.modern-tools.ir/webhook/github-done' }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          DURATION: "20"
          FILE_SIZE: "5MB"
          TAG_NAME: file-${{ github.run_number }}-${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          DOWNLOAD_LINK="https://github.com/${REPO}/releases/download/${TAG_NAME}/downloaded_file.mp4"
          curl -s -X POST "$WEBHOOK_URL" -H "Content-Type: application/json" -d "{"chat_id": "$CHAT_ID", "duration": "$DURATION", "file_size": "$FILE_SIZE", "download_link": "$DOWNLOAD_LINK"}"
