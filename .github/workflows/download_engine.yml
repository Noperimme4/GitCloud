name: GitCloud Advanced Engine

on:
  repository_dispatch:
    types: [start_download]
  workflow_dispatch:

jobs:
  process_download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python & yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install --upgrade yt-dlp

      - name: Download and Release
        env:
          TARGET_URL: ${{ github.event.client_payload.url }}
        run: |
          python3 -c "
          import subprocess
          import os
          url = os.environ.get('TARGET_URL') or 'https://youtu.be/gyUFqBm3Q4o'
          print('Downloading:', url)
          cmd = ['yt-dlp', '--no-playlist', '--extractor-args', 'youtube:player_client=android', '-f', '18/best', '-o', 'downloaded_file.mp4', url]
          res = subprocess.run(cmd)
          if res.returncode != 0 or not os.path.exists('downloaded_file.mp4') or os.path.getsize('downloaded_file.mp4'] < 1000000:
              print('Fallback download...')
              subprocess.run(['yt-dlp', '--no-playlist', '-o', 'downloaded_file.mp4', url])
          print('Final size:', os.path.getsize('downloaded_file.mp4') / (1024*1024), 'MB')
          "

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: file-${{ github.run_number }}
          files: downloaded_file.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
