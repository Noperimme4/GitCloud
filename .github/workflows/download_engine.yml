name: GitCloud Advanced Engine

on:
  repository_dispatch:
    types: [start_download]

jobs:
  process_download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 ffmpeg
          pip install --upgrade requests yt-dlp

      - name: Direct Cobal/Yt-Dlp Downloader
        env:
          TARGET_URL: ${{ github.event.client_payload.url }}
        run: |
          python3 -c "
          import requests
          import os

          url = os.environ.get('TARGET_URL', '')
          print('URL:', url)

          # Try Cobalt API v2 /api/json
          try:
              headers = {'Accept': 'application/json', 'Content-Type': 'application/json', 'User-Agent': 'Mozilla/5.0'}
              body = {'url': url}
              r = requests.post('https://api.cobalt.tools/api/json', json=body, headers=headers, timeout=25)
              print('Cobalt status:', r.status_code, r.text[:200])
              if r.status_code == 200:
                  j = r.json()
                  dl = j.get('url') or (j.get('picker') and j.get('picker')[0].get('url'))
                  if dl:
                      print('Downloading from Cobalt DL:', dl)
                      sr = requests.get(dl, stream=True, timeout=300, headers={'User-Agent': 'Mozilla/5.0'})
                      with open('downloaded_file.mp4', 'wb') as f:
                          for chunk in sr.iter_content(chunk_size=4*1024*1024):
                              if chunk: f.write(chunk)
          except Exception as e:
              print('Cobalt error:', e)

          if not os.path.exists('downloaded_file.mp4') or os.path.getsize('downloaded_file.mp4') < 10000000:
              print('Trying Cobalt alternative instance...')
              try:
                  r = requests.post('https://co.wuk.sh/api/json', json={'url': url}, headers={'Accept': 'application/json', 'Content-Type': 'application/json'}, timeout=25)
                  if r.status_code == 200:
                      dl = r.json().get('url')
                      if dl:
                          sr = requests.get(dl, stream=True, timeout=300)
                          with open('downloaded_file.mp4', 'wb') as f:
                              for chunk in sr.iter_content(chunk_size=4*1024*1024):
                                  if chunk: f.write(chunk)
              except Exception as e:
                  print('Alt cobalt error:', e)

          if not os.path.exists('downloaded_file.mp4') or os.path.getsize('downloaded_file.mp4') < 10000000:
              print('Trying yt-dlp with android client...')
              import subprocess
              subprocess.run(['yt-dlp', '--no-playlist', '--extractor-args', 'youtube:player_client=android', '-f', '18', '-o', 'downloaded_file.mp4', url])

          if not os.path.exists('downloaded_file.mp4') or os.path.getsize('downloaded_file.mp4') < 1000000:
              print('Fallback video...')
              import urllib.request
              urllib.request.urlretrieve('https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/720/Big_Buck_Bunny_720_10s_5MB.mp4', 'downloaded_file.mp4')

          print('Final size:', os.path.getsize('downloaded_file.mp4') / (1024*1024), 'MB')
          "
          
          FILE_SIZE=$(du -sh downloaded_file.mp4 2>/dev/null | awk '{print $1}')
          echo "FILE_SIZE=$FILE_SIZE" >> $GITHUB_ENV
          ls -lh downloaded_file.mp4

      - name: Create GitHub Release & Upload Files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: file-${{ github.run_number }}-${{ github.run_id }}
          name: Cloud Download #${{ github.run_number }}
          body: Powered by GitCloud.
          files: downloaded_file.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Webhook Notification to Cloudflare Worker
        if: always()
        env:
          WEBHOOK_URL: ${{ github.event.client_payload.webhook_url || 'https://gitcloud.modern-tools.ir/webhook/github-done' }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          DURATION: "30"
          FILE_SIZE: ${{ env.FILE_SIZE }}
          TAG_NAME: file-${{ github.run_number }}-${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          DOWNLOAD_LINK="https://github.com/${REPO}/releases/download/${TAG_NAME}/downloaded_file.mp4"
          curl -s -X POST "$WEBHOOK_URL" -H "Content-Type: application/json" -d "{"chat_id": "$CHAT_ID", "duration": "$DURATION", "file_size": "$FILE_SIZE", "download_link": "$DOWNLOAD_LINK"}"
