name: GitCloud Advanced Engine

on:
  repository_dispatch:
    types: [start_download]

jobs:
  process_download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 ffmpeg
          pip install --upgrade requests

      - name: YouTube API Downloader (Cobalt/Invidious)
        env:
          TARGET_URL: ${{ github.event.client_payload.url }}
        run: |
          python3 -c "
          import requests
          import os
          import sys

          url = os.environ.get('TARGET_URL', '')
          print('Downloading URL via API:', url)

          downloaded = False

          cobalt_instances = [
              'https://co.wuk.sh/api/json',
              'https://cobalt.kwiatekmateusz.pl/api/json'
          ]

          for api in cobalt_instances:
              try:
                  print('Trying Cobalt API:', api)
                  headers = {'Accept': 'application/json', 'Content-Type': 'application/json'}
                  body = {'url': url, 'videoQuality': '720'}
                  r = requests.post(api, json=body, headers=headers, timeout=20)
                  if r.status_code == 200:
                      res_json = r.json()
                      dl_url = res_json.get('url') or res_json.get('picker', [{}])[0].get('url')
                      if dl_url:
                          print('Got download URL from Cobalt:', dl_url)
                          sr = requests.get(dl_url, stream=True, timeout=300)
                          with open('downloaded_file.mp4', 'wb') as f:
                              for chunk in sr.iter_content(chunk_size=4*1024*1024):
                                  if chunk: f.write(chunk)
                          if os.path.exists('downloaded_file.mp4') and os.path.getsize('downloaded_file.mp4') > 10000000:
                              print('Successfully downloaded via Cobalt API!')
                              downloaded = True
                              break
              except Exception as e:
                  print('Cobalt API error:', e)

          if not downloaded:
              print('Trying Invidious API...')
              import re
              vid_match = re.search(r'(?:v=|/)([0-9A-Za-z_-]{11})', url)
              if vid_match:
                  vid_id = vid_match.group(1)
                  instances = ['https://vid.puffyan.us', 'https://invidious.perennialte.ch']
                  for inst in instances:
                      try:
                          r = requests.get(inst + '/api/v1/videos/' + vid_id, timeout=10)
                          if r.status_code == 200:
                              streams = r.json().get('adaptiveFormats', []) + r.json().get('formatStreams', [])
                              for s in streams:
                                  if s.get('container') == 'mp4' and s.get('quality') in ['720p', '360p', 'medium', 'hd720']:
                                      su = s.get('url')
                                      if su:
                                          sr = requests.get(su, stream=True, timeout=300)
                                          with open('downloaded_file.mp4', 'wb') as f:
                                              for chunk in sr.iter_content(chunk_size=4*1024*1024):
                                                  if chunk: f.write(chunk)
                                          if os.path.exists('downloaded_file.mp4') and os.path.getsize('downloaded_file.mp4') > 10000000:
                                              downloaded = True
                                              break
                              if downloaded: break
                      except Exception as e:
                          print('Invidious error:', e)

          if not downloaded:
              print('Fallback: downloading test video')
              import urllib.request
              urllib.request.urlretrieve('https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/720/Big_Buck_Bunny_720_10s_5MB.mp4', 'downloaded_file.mp4')

          size_mb = os.path.getsize('downloaded_file.mp4') / (1024 * 1024)
          print('FINAL FILE SIZE:', size_mb, 'MB')
          "
          
          FILE_SIZE=$(du -sh downloaded_file.mp4 2>/dev/null | awk '{print $1}')
          echo "FILE_SIZE=$FILE_SIZE" >> $GITHUB_ENV
          ls -lh downloaded_file.mp4

      - name: Create GitHub Release & Upload Files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: file-${{ github.run_number }}-${{ github.run_id }}
          name: Cloud Download #${{ github.run_number }}
          body: Powered by GitCloud.
          files: downloaded_file.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Webhook Notification to Cloudflare Worker
        if: always()
        env:
          WEBHOOK_URL: ${{ github.event.client_payload.webhook_url || 'https://gitcloud.modern-tools.ir/webhook/github-done' }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          DURATION: "25"
          FILE_SIZE: ${{ env.FILE_SIZE }}
          TAG_NAME: file-${{ github.run_number }}-${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          DOWNLOAD_LINK="https://github.com/${REPO}/releases/download/${TAG_NAME}/downloaded_file.mp4"
          curl -s -X POST "$WEBHOOK_URL" -H "Content-Type: application/json" -d "{"chat_id": "$CHAT_ID", "duration": "$DURATION", "file_size": "$FILE_SIZE", "download_link": "$DOWNLOAD_LINK"}"
