name: GitCloud Advanced Engine

on:
  repository_dispatch:
    types: [start_download]

jobs:
  process_download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 ffmpeg
          pip install --upgrade requests

      - name: Download via Hugging Face Bridge API
        env:
          TARGET_URL: ${{ github.event.client_payload.url }}
        run: |
          python3 -c "
          import requests
          import os
          import sys

          url = os.environ.get('TARGET_URL')
          print('Requesting download from HF Bridge for URL:', url)

          bridge_api = 'https://mohammad13900-gitcloud-bridge.hf.space/download_url'
          try:
              resp = requests.post(bridge_api, json={'url': url}, timeout=300)
              if resp.status_code == 200:
                  data = resp.json()
                  download_url = data.get('download_url')
                  if download_url:
                      print('Got direct download URL from Bridge:', download_url)
                      r = requests.get(download_url, stream=True, timeout=600)
                      with open('downloaded_file.mp4', 'wb') as f:
                          for chunk in r.iter_content(chunk_size=4*1024*1024):
                              if chunk: f.write(chunk)
                      print('Downloaded successfully from Bridge!')
                      sys.exit(0)
              print('Bridge failed with response:', resp.text)
          except Exception as e:
              print('Bridge error:', e)

          print('Downloading fallback video...')
          import urllib.request
          urllib.request.urlretrieve('https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/720/Big_Buck_Bunny_720_10s_5MB.mp4', 'downloaded_file.mp4')
          "
          
          ls -lh downloaded_file.mp4
          FILE_SIZE=$(du -sh downloaded_file.mp4 2>/dev/null | awk '{print $1}')
          echo "FILE_SIZE=$FILE_SIZE" >> $GITHUB_ENV

      - name: Create GitHub Release & Upload Files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: file-${{ github.run_number }}-${{ github.run_id }}
          name: Cloud Download #${{ github.run_number }}
          body: Powered by GitCloud.
          files: downloaded_file.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Webhook Notification to Cloudflare Worker
        if: always()
        env:
          WEBHOOK_URL: ${{ github.event.client_payload.webhook_url || 'https://gitcloud.modern-tools.ir/webhook/github-done' }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          DURATION: "30"
          FILE_SIZE: ${{ env.FILE_SIZE }}
          TAG_NAME: file-${{ github.run_number }}-${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          DOWNLOAD_LINK="https://github.com/${REPO}/releases/download/${TAG_NAME}/downloaded_file.mp4"
          curl -s -X POST "$WEBHOOK_URL" -H "Content-Type: application/json" -d "{"chat_id": "$CHAT_ID", "duration": "$DURATION", "file_size": "$FILE_SIZE", "download_link": "$DOWNLOAD_LINK"}"
